apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: payment-application
  namespace: argocd

spec:
  project: default
  source:
    repoURL: https://github.com/sanjeev059/eks-production-lab.git
    targetRevision: main
    path: payments/gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: payments
  syncPolicy:
    automated:
      prune: true
      selfHeal: true