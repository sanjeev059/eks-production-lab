apiVersion: apps/v1
kind: Deployment

metadata:
  name: payment-app
  namespace: payments
  labels:
    app: payment-app
  annotations:
    kubernetes.io/change-cause: "Initial deployment of payment-app v1.0.0"

spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

  selector:
    matchLabels:
      app: payment-app

  template:
    metadata:
      labels:
        app: payment-app

    spec:
      containers:
        - name: payment-app
          image: payment-api:v1
          imagePullPolicy: IfNotPresent
          
          envFrom:
            - configMapRef:
                name: payments-config
          ports:
            - containerPort: 5000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20