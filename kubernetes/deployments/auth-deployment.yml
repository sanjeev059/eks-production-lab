apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service
  namespace: production

spec:
  replicas: 3

  selector:
    matchLabels:
      app: auth-service
      tier: backend

  template:
    metadata:
      labels:
        app: auth-service
        tier: backend

    spec:
      containers:
        - name: auth-service
          image: auth-service:v2

          envFrom:
            - configMapRef:
                name: auth-config
            - secretRef:
                name: mysecret
          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 5